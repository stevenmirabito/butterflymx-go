query TenantAccessPoints($ids: [ID!]!, $after: String) { nodes(ids: $ids) { __typename id ... on Tenant { accessPoints(after: $after) { __typename pageInfo { __typename ...PageInfoFragment } nodes { __typename ...AccessPointFragment } } } } }
fragment AccessPointFragment on AccessPoint { __typename id legacyId name capabilities openDuration online inOpenHours doorOpenSchedules { __typename ...TimeRestrictionFragment } accessTimes { __typename ...TimeRestrictionFragment } building { __typename ...BuildingFragment } reservations { __typename ...AccessPointReservationFragment } devices { __typename nodes { __typename ... on Intercom { id name serialNumber } ... on CloudBasedAccessController { id name readerSerialNumbers } } } }
fragment AccessPointReservationFragment on ReservationUnionConnection { __typename nodes { __typename ... on AnonymousReservation { id startsAt endsAt } ... on Reservation { id startsAt endsAt amenity { __typename id } } } }
fragment BuildingFragment on Building { __typename id guid name address { __typename country } capabilities enabledIntegrations contactLabel contactPhoneNumber timeZone amenityReservationsFeeStrategy virtualKeysDurationPeriod geofence { __typename id centerLatitude centerLongitude radiusUnit radiusValue } suspended }
fragment PageInfoFragment on PageInfo { __typename hasNextPage endCursor }
fragment TimeRestrictionFragment on TimeRestriction { __typename from to days }
