query GetBLECredentials($tenantId: ID!, $userDeviceId: ID!) { nodes(ids: [$tenantId]) { __typename ... on Tenant { building { __typename intercomBleDeviceKey(userDeviceId: $userDeviceId) wavelynxReaderBleCredential(tenantId: $tenantId, userDeviceId: $userDeviceId) { __typename encryptedCredentialBlob kmd } } } } }
